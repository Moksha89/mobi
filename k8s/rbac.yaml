apiVersion: v1
kind: ServiceAccount
metadata:
  name: mch-controller
  namespace: android-cloud
  labels:
    app: mobile-control-hub
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mch-android-manager
  labels:
    app: mobile-control-hub
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec", "services", "persistentvolumeclaims", "configmaps", "nodes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mch-android-manager-binding
  labels:
    app: mobile-control-hub
subjects:
  - kind: ServiceAccount
    name: mch-controller
    namespace: android-cloud
roleRef:
  kind: ClusterRole
  name: mch-android-manager
  apiGroup: rbac.authorization.k8s.io
